name: Prod smoke (nightly)

# Runs the @smoke Playwright suite against the LIVE site (no local build).
# Read-only: browses, adds to cart, never checks out.
#
# OFF until launch. To turn on (repo Settings → Secrets and variables →
# Actions → Variables):
#   PROD_MONITOR             = on
#   E2E_TEST_PRODUCT_HANDLE  = a permanent, in-stock, published product handle
#   E2E_TEST_PRODUCT_TITLE   = that product's exact title
# A failed run emails the repo owner (GitHub default for scheduled workflows).

on:
  schedule:
    - cron: '17 9 * * *' # 09:17 UTC ≈ 4:17 ET, off-peak
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke vs www.wildenflower.com
    if: ${{ vars.PROD_MONITOR == 'on' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE_URL: https://www.wildenflower.com
      E2E_TEST_PRODUCT_HANDLE: ${{ vars.E2E_TEST_PRODUCT_HANDLE }}
      E2E_TEST_PRODUCT_TITLE: ${{ vars.E2E_TEST_PRODUCT_TITLE }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Require a prod test product
        run: |
          if [ -z "$E2E_TEST_PRODUCT_HANDLE" ] || [ -z "$E2E_TEST_PRODUCT_TITLE" ]; then
            echo "::error::Set repo variables E2E_TEST_PRODUCT_HANDLE and E2E_TEST_PRODUCT_TITLE (see header)."
            exit 1
          fi

      - run: npx playwright install --with-deps chromium

      - name: Run @smoke against prod
        run: npx playwright test --grep @smoke --project=chromium --project=mobile-chrome

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: prod-smoke-report
          path: playwright-report/
          retention-days: 14
