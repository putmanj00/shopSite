name: Codex Autofix (apply)

# PHASE 2 — gated auto-fixer. A maintainer types `/codex-fix` on a PR; this
# re-gathers + re-adjudicates Codex's findings (Phase-1 scripts, reused), then
# for the FIX-verdict ones runs claude-code-action as an EDIT-ONLY engine inside
# a hard scope fence, gates the result against the full CI gate set locally, and
# only then commits + pushes (via a CI-re-triggering token). Merge stays human.
#
# Safety stack — see docs/codex-autofix-loop.md "Phase 2":
#   1. Scope fence       edits must be a strict subset of the PR's changed files
#                        minus a do-not-touch denylist (auth, webhooks, Shopify
#                        mutations, CI, these scripts, lockfiles); else hard reset.
#   2. Deterministic gate the fixer has NO shell (Bash denied) so it cannot
#                        git/commit; a bash step runs lint+typecheck+build+slop
#                        and commits ONLY on green.
#   3. Stale-CI hazard   a GITHUB_TOKEN push does NOT re-trigger CI; push with a
#                        GitHub App token (re-triggers ci.yml) or fall back to
#                        workflow_dispatch + a blocking sticky note.
#   4. Round cap         durable, bot-authored, signed state; finding-hash
#                        deduped; capped per PR; concurrency serialized.
#   5. Terminal states   DISABLED / MISSING_SECRET / FORK_PR / ROUND_CAP /
#                        NO_APPROVED_FINDINGS / SCOPE_VIOLATION / GATE_FAILED /
#                        NO_CHANGES each exit 0 with a clear sticky status.
#
# TRUST: scripts run from a trusted DEFAULT-branch checkout, relocated to the
# runner temp dir ($RUNNER_TEMP/bot) — NEVER the PR head copy, which a
# contributor could weaponize. The relocation also keeps the tooling alive
# across the PR-head checkout, which re-inits git at the workspace root and
# deletes the root's contents to do so (even with clean:false). The slop gate
# likewise runs the trusted check.sh against absolute PR-file paths.

on:
  issue_comment:
    types: [created]

# Least privilege by default; the job below elevates only what it needs.
permissions:
  contents: read

# One autofix at a time per PR — the durable state comment is read-modify-write.
concurrency:
  group: codex-autofix-fix-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  autofix:
    runs-on: ubuntu-latest
    # Scope the run to the protected `codex-autofix` environment so the
    # environment-scoped ANTHROPIC_API_KEY secret resolves (it is empty
    # otherwise) and the branch policy on the env is enforced.
    environment: codex-autofix
    # HUMAN AUTHORIZATION is the trigger: a PR comment starting with `/codex-fix`
    # from someone with write access. The bot never self-triggers Phase 2.
    if: >-
      github.event.issue.pull_request != null &&
      startsWith(github.event.comment.body, '/codex-fix') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    permissions:
      contents: write # commit + push the vetted fix
      pull-requests: write # sticky status + durable state comments
      issues: write # PR conversation comments are issue comments
      models: read # re-adjudicate via GitHub Models
      actions: write # workflow_dispatch fallback re-trigger of ci.yml
      id-token: write # claude-code-action mints an OIDC token during setup
    env:
      ROUND_CAP: "2"
      # Secrets/vars surfaced as booleans — secrets can't be read in `if:`, but
      # an env mapped from a secret can. These never expose the secret value.
      FIX_ENABLED: ${{ vars.CODEX_AUTOFIX_FIX_ENABLED == 'true' }}
      HAS_ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
      # Both App secrets must be present, or token-mint fails after we've already
      # decided to take the App path — half-configured ⇒ fall back to GITHUB_TOKEN.
      HAS_APP: ${{ secrets.APP_ID != '' && secrets.APP_PRIVATE_KEY != '' }}
      FIXER_MODEL: ${{ vars.CODEX_AUTOFIX_FIXER_MODEL || 'claude-sonnet-4-6' }}
    steps:
      # 1) Trusted tooling from the DEFAULT branch into _bot, then move it OUT of
      #    the workspace. The PR-head checkout (step 6) re-inits git at the
      #    workspace root and DELETES the root's contents to do so (even with
      #    clean:false), which would otherwise wipe these trusted scripts and the
      #    scratch artifacts (findings, fixable.md) produced below.
      - name: Checkout trusted scripts
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          path: _bot
          persist-credentials: false

      # 1b) Relocate the tooling to the runner temp dir, outside the workspace,
      #     so the PR-head checkout can never delete it.
      - name: Relocate tooling outside the workspace
        run: mv _bot "$RUNNER_TEMP/bot"

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      # 2) Resolve the PR + collect Codex findings. Reuses the Phase-1 gatherer,
      #    which enforces the same-repo (anti-fork) guard and emits base_sha /
      #    head_ref for the checkout + scope diff below.
      - name: Gather Codex findings (+ same-repo guard)
        id: gather
        working-directory: ${{ runner.temp }}/bot
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: node scripts/codex-autofix/gather-findings.mjs

      # 2b) HARD authorization. The job `if:` filters on author_association, but
      #     that is NOT a write-permission check — a read-only COLLABORATOR passes
      #     it. Verify the commenter actually has write/maintain/admin BEFORE any
      #     model spend or write-token path. `none` (404) ⇒ fail closed.
      - name: Verify commenter write access
        id: perm
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENTER: ${{ github.event.comment.user.login }}
          OWNER_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # The default GITHUB_TOKEN (with repo access) can read this endpoint; it
          # returns admin/maintain/write/triage/read/none. GitHub logins are
          # [A-Za-z0-9-]; passed via env, used only in the API path. The endpoint
          # collapses to a clear permission string; fail CLOSED on any lookup error.
          perm="$(gh api "repos/${OWNER_REPO}/collaborators/${COMMENTER}/permission" \
            --jq '.permission' 2>/tmp/perm.err || true)"
          if [ -z "$perm" ]; then
            echo "permission lookup failed — treating as unauthorized:"
            cat /tmp/perm.err || true
            perm=none
          fi
          case "$perm" in
            admin|maintain|write) authorized=true ;;
            *) authorized=false ;;
          esac
          echo "authorized=$authorized" >> "$GITHUB_OUTPUT"
          echo "commenter '${COMMENTER}' permission='${perm}' authorized=${authorized}"

      - name: Compute gate flags
        id: flags
        run: |
          is_fork=false
          [ "${{ steps.gather.outputs.skip_reason }}" = "FORK_PR" ] && is_fork=true
          has_findings=false
          [ "${{ steps.gather.outputs.proceed }}" = "true" ] && has_findings=true
          authorized="${{ steps.perm.outputs.authorized }}"
          {
            echo "is_fork=$is_fork"
            echo "has_findings=$has_findings"
            echo "attempt=$([ "$FIX_ENABLED" = "true" ] && [ "$HAS_ANTHROPIC_KEY" = "true" ] && [ "$is_fork" = "false" ] && [ "$has_findings" = "true" ] && [ "$authorized" = "true" ] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"

      # 2c) Early race check. The push step re-checks this after the model/gate
      #     work, but catching a moved/deleted branch here avoids spending a
      #     fixer round on a stale tree.
      - name: Verify branch still at gathered head
        id: stale
        if: ${{ steps.flags.outputs.attempt == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ steps.gather.outputs.head_ref }}
          EXPECTED_SHA: ${{ steps.gather.outputs.head_sha }}
        run: |
          set -euo pipefail
          remote_tip="$(gh api "repos/${{ github.repository }}/git/ref/heads/${HEAD_REF}" --jq '.object.sha' 2>/dev/null || true)"
          if [ "$remote_tip" = "$EXPECTED_SHA" ]; then
            echo "fresh=true" >> "$GITHUB_OUTPUT"
            echo "branch ${HEAD_REF} still at ${EXPECTED_SHA}"
          else
            echo "fresh=false" >> "$GITHUB_OUTPUT"
            echo "branch ${HEAD_REF} moved/deleted before autofix: expected ${EXPECTED_SHA}, got ${remote_tip:-<none>}"
          fi

      # 3) Read durable round-state (bot-authored + optionally HMAC-signed).
      - name: Read durable state
        working-directory: ${{ runner.temp }}/bot
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.gather.outputs.pr_number }}
          CODEX_AUTOFIX_STATE_SECRET: ${{ secrets.CODEX_AUTOFIX_STATE_SECRET }}
        run: node scripts/codex-autofix/fix-state.mjs read

      # 4) Adjudicate findings (FIX / REJECT / ESCALATE). Skipped when a terminal
      #    is already certain (disabled / no key / fork / no findings) to avoid
      #    spending a model call. Non-OpenAI judge so Codex isn't grading itself.
      - name: Adjudicate findings
        if: ${{ steps.flags.outputs.attempt == 'true' && steps.stale.outputs.fresh == 'true' }}
        working-directory: ${{ runner.temp }}/bot
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ADJUDICATOR_MODEL: ${{ vars.CODEX_AUTOFIX_ADJUDICATOR_MODEL || 'mistral-ai/mistral-medium-2505' }}
        run: node scripts/codex-autofix/adjudicate.mjs

      # 5) Decide: terminal vs proceed, select fresh un-attempted FIX findings,
      #    apply the round cap + hash dedupe. decide() is unit-tested.
      - name: Select fixable findings
        id: select
        working-directory: ${{ runner.temp }}/bot
        env:
          FIX_ENABLED: ${{ env.FIX_ENABLED }}
          HAS_ANTHROPIC_KEY: ${{ env.HAS_ANTHROPIC_KEY }}
          IS_FORK: ${{ steps.flags.outputs.is_fork }}
          AUTHORIZED: ${{ steps.perm.outputs.authorized }}
          ROUND_CAP: ${{ env.ROUND_CAP }}
        run: node scripts/codex-autofix/select-fixable.mjs

      # 6) Check out the PR HEAD at the (now-empty) workspace root. The trusted
      #    tooling was moved to $RUNNER_TEMP in step 1b, so this checkout's
      #    workspace re-init can't touch it.
      #    - Pin the IMMUTABLE head SHA (not the floating head_ref): the branch
      #      could move between gather and here, which would fix the wrong tree or
      #      fail the push (TOCTOU). The push step re-verifies the remote tip.
      #    - persist-credentials:false — never leave a push token in .git/config
      #      while the model runs with Read/Write; creds are injected only at push.
      - name: Checkout PR head
        if: ${{ steps.select.outputs.proceed == 'true' }}
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ steps.gather.outputs.head_sha }}
          clean: false
          persist-credentials: false

      # 6b) Hide the tooling dir + our scratch artifacts from the PR worktree so
      #     `git add -A` / scope enforcement only ever see the fixer's edits.
      - name: Isolate tooling from worktree
        if: ${{ steps.select.outputs.proceed == 'true' }}
        run: |
          printf '%s\n' '/changed-files.txt' '/allowed-paths.json' \
            '/allowed-paths.md' '/scope-violations.json' >> .git/info/exclude

      # 7) Compute the allowed edit surface from the gathered immutable PR
      #    snapshot (`base_sha...head_sha`) minus the do-not-touch denylist.
      - name: List gathered changed files
        if: ${{ steps.select.outputs.proceed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ steps.gather.outputs.base_sha }}
          HEAD_SHA: ${{ steps.gather.outputs.head_sha }}
        run: |
          gh api "repos/${{ github.repository }}/compare/${BASE_SHA}...${HEAD_SHA}" \
            --jq '.files[] | select(.status == "added" or .status == "modified" or .status == "renamed" or .status == "changed") | .filename' \
            > changed-files.txt

      - name: Compute scope fence
        if: ${{ steps.select.outputs.proceed == 'true' }}
        run: node "$RUNNER_TEMP/bot/scripts/codex-autofix/scope-fence.mjs" compute

      - name: Compose fixer prompt
        if: ${{ steps.select.outputs.proceed == 'true' }}
        id: prompt
        run: |
          {
            echo 'text<<PROMPT_EOF'
            cat <<'HEAD'
          You are an automated code-fixer for a Next.js + TypeScript storefront.
          Apply MINIMAL edits that resolve ONLY the approved review findings below.

          HARD RULES:
          - Edit ONLY files in the "Allowed files" list. Touch nothing else.
          - Do NOT create new files, rename, or delete files.
          - Do NOT edit tests, config, dependencies, CI, auth, webhooks, or Shopify
            mutations. If a finding can't be fixed within the allowed files, skip it.
          - Keep changes surgical and idiomatic to the surrounding code.
          - Brand: no purple/violet, no Playfair, no fabricated stats/testimonials,
            no "boho/cosmic/festival" voice, no emoji decoration. (Wildenflower slop bans.)
          - You have no shell and cannot run git. Just edit the files.

          Approved findings:
          HEAD
            cat "$RUNNER_TEMP/bot/fixable.md"
            echo
            echo 'Allowed files:'
            cat allowed-paths.md
            # Guarantee the heredoc terminator sits on its own line even if the
            # file above has no trailing newline (else $GITHUB_OUTPUT reports
            # "Matching delimiter not found").
            echo
            echo PROMPT_EOF
          } >> "$GITHUB_OUTPUT"

      - name: Write fixer settings (deny shell + network)
        if: ${{ steps.select.outputs.proceed == 'true' }}
        run: |
          cat > "${{ runner.temp }}/autofix-settings.json" <<'JSON'
          { "permissions": { "deny": ["Bash", "WebFetch", "WebSearch", "Task"],
                             "allow": ["Read", "Edit", "Write", "Grep", "Glob"] } }
          JSON

      # 8) EDIT-ONLY fixer. Bash denied ⇒ cannot git/commit/push; we own the
      #    commit after the gate. Tool-restriction goes through claude_args /
      #    settings (verified: v1 has no `allowed_tools` input — see the doc).
      - name: Apply fixes (claude-code-action, edit-only)
        if: ${{ steps.select.outputs.proceed == 'true' }}
        uses: anthropics/claude-code-action@9dd8b95a392eb34b6f5fb56cf5a64cb735912d4b # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Use the workflow's GITHUB_TOKEN for GitHub ops. Without this the action
          # tries an OIDC→Claude-GitHub-App token exchange (401 "Claude Code is not
          # installed on this repository"); we authenticate Claude via the API key
          # and never install that App. OUR push step owns the actual commit.
          github_token: ${{ github.token }}
          prompt: ${{ steps.prompt.outputs.text }}
          claude_args: >-
            --model ${{ env.FIXER_MODEL }}
            --max-turns 30
            --settings ${{ runner.temp }}/autofix-settings.json

      # 9) Re-own the commit: if the action self-committed, soft-rewind to the PR
      #    head SHA so its edits sit in the working tree and OUR gate owns the
      #    single commit. No-op when the action only edited the working tree.
      - name: Re-own working tree
        if: ${{ steps.select.outputs.proceed == 'true' }}
        run: git reset --mixed "${{ steps.gather.outputs.head_sha }}"

      # 10) ENFORCE the scope fence: any edit outside the allowed set / on a
      #     denylisted path hard-resets and fails this step (→ SCOPE_VIOLATION).
      - name: Enforce scope fence
        id: enforce
        if: ${{ steps.select.outputs.proceed == 'true' }}
        continue-on-error: true
        run: node "$RUNNER_TEMP/bot/scripts/codex-autofix/scope-fence.mjs" enforce

      # 11) DETERMINISTIC GATE mirroring the CI gate set, run BEFORE any commit.
      #     Slop uses the TRUSTED check.sh against absolute PR-file paths.
      - name: Gate — lint / typecheck / build / slop
        id: gate
        if: ${{ steps.select.outputs.proceed == 'true' && steps.enforce.outcome == 'success' }}
        continue-on-error: true
        # Mirror ci.yml's build env, or `next build` (+ contrast:check) fails on
        # missing Shopify config and every legit fix would be a false GATE_FAILED.
        env:
          SHOPIFY_STORE_DOMAIN: ${{ secrets.SHOPIFY_STORE_DOMAIN }}
          SHOPIFY_STOREFRONT_ACCESS_TOKEN: ${{ secrets.SHOPIFY_STOREFRONT_ACCESS_TOKEN }}
          SHOPIFY_SHOP_ID: ${{ secrets.SHOPIFY_SHOP_ID }}
          NEXT_PUBLIC_BASE_URL: https://wildenflower.com
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          npm ci
          npm run lint
          npm run typecheck
          npm run build            # includes contrast:check
          # Slop-detector on changed in-scope files only (touched-file ratchet).
          mapfile -t changed < <(git diff --name-only --diff-filter=ACMR)
          if [ "${#changed[@]}" -gt 0 ]; then
            abs=(); for f in "${changed[@]}"; do abs+=("$PWD/$f"); done
            bash "$RUNNER_TEMP/bot/.claude/skills/slop-detector/check.sh" "${abs[@]}"
          fi

      # 11b) Install a pinned + checksummed gitleaks for the staged-secret scan in
      #      the push step (defense in depth now that the checkout persists no creds).
      - name: Install gitleaks (pinned + checksummed)
        if: ${{ steps.select.outputs.proceed == 'true' && steps.enforce.outcome == 'success' && steps.gate.outcome == 'success' }}
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # 12a) Preferred push: GitHub App token re-triggers ci.yml automatically.
      - name: Mint GitHub App token
        id: apptoken
        if: ${{ steps.select.outputs.proceed == 'true' && steps.enforce.outcome == 'success' && steps.gate.outcome == 'success' && env.HAS_APP == 'true' }}
        # A mint failure must not abort: an empty token makes the push step fall
        # back to the GITHUB_TOKEN path rather than burning the round (INFRA_ERROR).
        continue-on-error: true
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      # 12b) Commit + push the vetted change. Emits pushed_sha + outcome.
      - name: Commit and push
        id: push
        if: ${{ steps.select.outputs.proceed == 'true' && steps.enforce.outcome == 'success' && steps.gate.outcome == 'success' }}
        env:
          APP_TOKEN: ${{ steps.apptoken.outputs.token }}
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ steps.gather.outputs.head_ref }}
          EXPECTED_SHA: ${{ steps.gather.outputs.head_sha }}
          ROUND: ${{ steps.select.outputs.round }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            { echo "outcome=NO_CHANGES"; echo "pushed_sha="; echo "ci_note="; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Secret-scan the STAGED tree BEFORE any commit/push (the checkout no
          # longer persists a push token; this is the last gate before the fix
          # leaves the runner). A hit reverts to a clean terminal, nothing pushed.
          if ! gitleaks git --staged --redact --no-banner .; then
            { echo "outcome=SECRET_FOUND"; echo "pushed_sha="; echo "ci_note="; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "fix: codex autofix round ${ROUND} [skip codex]" \
            -m "Automated fix of adjudicated Codex findings. Gate: lint+typecheck+build+slop+gitleaks green." \
            --trailer "Assistant=Claude Code"
          sha="$(git rev-parse HEAD)"
          owner_repo="${{ github.repository }}"
          # Inject the push credential here (checkout used persist-credentials:false).
          if [ -n "${APP_TOKEN:-}" ]; then
            push_token="$APP_TOKEN"; use_app=true
          else
            push_token="$GH_TOKEN"; use_app=false
          fi
          git remote set-url origin "https://x-access-token:${push_token}@github.com/${owner_repo}.git"
          # TOCTOU guard: we checked out the immutable head SHA. Require the remote
          # branch to STILL exist AND still point at that SHA. Empty (branch deleted
          # mid-run, or lookup failure) OR moved ⇒ refuse — never recreate a deleted
          # branch or clobber newer work. STALE_HEAD does not advance round-state.
          remote_tip="$(git ls-remote origin "refs/heads/${HEAD_REF}" | cut -f1)" || true
          if [ "$remote_tip" != "$EXPECTED_SHA" ]; then
            { echo "outcome=STALE_HEAD"; echo "pushed_sha="; echo "ci_note="; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Our commit is a child of EXPECTED_SHA, so a normal push is fast-forward;
          # a non-ff (race) is rejected safely rather than force-pushed.
          git push origin "HEAD:${HEAD_REF}"
          if [ "$use_app" = "true" ]; then
            note="CI re-triggered automatically by the push (GitHub App token)."
          else
            # GITHUB_TOKEN pushes do NOT trigger CI — dispatch as a partial fallback,
            # and report HONESTLY whether the dispatch actually started (no false green).
            if gh workflow run ci.yml --ref "${HEAD_REF}"; then
              note="⚠️ Pushed with GITHUB_TOKEN, which does NOT auto-run CI. Dispatched ci.yml on ${HEAD_REF} as a partial fallback (PR-only jobs like slop are skipped) — confirm a green CI run on ${sha} before merge."
            else
              note="⛔ Pushed with GITHUB_TOKEN (no auto-CI) AND the ci.yml workflow_dispatch fallback FAILED to start — CI is NOT running on ${sha}. Trigger CI manually before merge."
            fi
          fi
          { echo "outcome=FIXED"; echo "pushed_sha=${sha}"; echo "ci_note=${note}"; } >> "$GITHUB_OUTPUT"

      # 13) Single terminal/finalize path — always runs, posts the sticky status,
      #     and advances durable state on FIXED / NO_CHANGES (anti-thrash).
      - name: Finalize (sticky status + durable state)
        if: ${{ always() }}
        working-directory: ${{ runner.temp }}/bot
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.gather.outputs.pr_number }}
          HEAD_SHA: ${{ steps.gather.outputs.head_sha }}
          ROUND: ${{ steps.select.outputs.round }}
          ROUND_CAP: ${{ env.ROUND_CAP }}
          FIX_COUNT: ${{ steps.select.outputs.fix_count }}
          PUSHED_SHA: ${{ steps.push.outputs.pushed_sha }}
          CI_NOTE: ${{ steps.push.outputs.ci_note }}
          CODEX_AUTOFIX_STATE_SECRET: ${{ secrets.CODEX_AUTOFIX_STATE_SECRET }}
          # Precedence: stale branch wins first (no model/fixer round should be
          # counted), then pre-fixer terminals, then real scope/gate failures
          # (both ADVANCE — the fixer ran and produced a bad change), then the
          # push step's own outcome. Final fallback is INFRA_ERROR (NOT
          # GATE_FAILED): unenumerated failures are infrastructure, not finding
          # quality, so they must NOT advance the round and burn findings.
          OUTCOME: >-
            ${{ steps.stale.outputs.fresh == 'false' && 'STALE_HEAD'
            || (steps.select.outputs.terminal != '' && steps.select.outputs.terminal
            || (steps.enforce.outcome == 'failure' && 'SCOPE_VIOLATION'
            || (steps.gate.outcome == 'failure' && 'GATE_FAILED'
            || (steps.push.outputs.outcome != '' && steps.push.outputs.outcome
            || 'INFRA_ERROR')))) }}
        run: node scripts/codex-autofix/fix-state.mjs finalize
