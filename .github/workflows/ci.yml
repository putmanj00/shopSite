name: CI

# Required GitHub Secrets (Settings → Secrets and Variables → Actions → Repository secrets):
#   SHOPIFY_STORE_DOMAIN           — e.g. wildenflower.myshopify.com
#   SHOPIFY_STOREFRONT_ACCESS_TOKEN — public Storefront API token
#   SHOPIFY_SHOP_ID                — numeric Shopify shop ID
# NEXT_PUBLIC_BASE_URL is hardcoded to https://wildenflower.com (not a secret)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  quality:
    name: Quality (lint / typecheck / build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          SHOPIFY_STORE_DOMAIN: ${{ secrets.SHOPIFY_STORE_DOMAIN }}
          SHOPIFY_STOREFRONT_ACCESS_TOKEN: ${{ secrets.SHOPIFY_STOREFRONT_ACCESS_TOKEN }}
          SHOPIFY_SHOP_ID: ${{ secrets.SHOPIFY_SHOP_ID }}
          NEXT_PUBLIC_BASE_URL: https://wildenflower.com
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

  e2e:
    name: E2E (${{ matrix.browser }})
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npx playwright test --project=${{ matrix.browser }}
        env:
          CI: true
          SHOPIFY_STORE_DOMAIN: ${{ secrets.SHOPIFY_STORE_DOMAIN }}
          SHOPIFY_STOREFRONT_ACCESS_TOKEN: ${{ secrets.SHOPIFY_STOREFRONT_ACCESS_TOKEN }}
          NEXT_PUBLIC_SHOPIFY_STORE_DOMAIN: ${{ secrets.SHOPIFY_STORE_DOMAIN }}
          NEXT_PUBLIC_SHOPIFY_STOREFRONT_ACCESS_TOKEN: ${{ secrets.SHOPIFY_STOREFRONT_ACCESS_TOKEN }}
          NEXT_PUBLIC_BASE_URL: http://localhost:3000

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 30

  secrets:
    name: Secrets Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm audit --audit-level=high --omit=dev

  # Production deploys are handled by Vercel's native GitHub integration
  # (the "Vercel – shopsite-prod" check on each push to main), not by this
  # workflow. A former `deploy-prod` job that shelled out to the Vercel CLI
  # was removed: it never deployed anything real (its VERCEL_PROJECT_ID_PROD
  # secret pointed at a non-existent project, so `vercel pull` failed with
  # "Project not found"), and it duplicated the native integration while
  # parking every push on a required-reviewer approval gate. If a
  # CLI-driven deploy is ever needed again, restore it with correct
  # VERCEL_ORG_ID / VERCEL_PROJECT_ID_PROD / VERCEL_TOKEN secrets.
