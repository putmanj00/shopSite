name: CI

# Required GitHub Secrets (Settings → Secrets and Variables → Actions → Repository secrets):
#   CI_SHOPIFY_STORE_DOMAIN            — CI development store (wildenflower-ci.myshopify.com)
#   CI_SHOPIFY_STOREFRONT_ACCESS_TOKEN — public Storefront token for that store
#   SHOPIFY_SHOP_ID                    — numeric shop ID (customer-account OAuth URL only;
#                                        no CI test performs a real login)
# CI builds and tests against the development store's permanent fixture
# products (ci-*), never the production catalog, so merchandising edits on the
# real store cannot break CI. The prod-store SHOPIFY_STORE_DOMAIN /
# SHOPIFY_STOREFRONT_ACCESS_TOKEN secrets are no longer read here.
# NEXT_PUBLIC_BASE_URL is hardcoded to https://wildenflower.com (not a secret)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Fallback re-trigger for the Phase-2 autofixer (codex-autofix-fix.yml): a
  # GITHUB_TOKEN push does not start CI, so when no GitHub App token is
  # configured the fixer dispatches this workflow on the branch. NOTE: under
  # workflow_dispatch the PR-only `slop` job is skipped (its `if:` is
  # pull_request) — the sticky status flags CI as needing manual confirmation.
  workflow_dispatch:

jobs:
  quality:
    name: Quality (lint / typecheck / build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - name: Unit tests (pure-logic)
        run: |
          npm run test:button
          npm run test:entry
          npm run test:care
          npm run test:return-to
          npm run test:auth-errors
          npm run test:signup

      - name: Build
        run: npm run build
        env:
          SHOPIFY_STORE_DOMAIN: ${{ secrets.CI_SHOPIFY_STORE_DOMAIN }}
          SHOPIFY_STOREFRONT_ACCESS_TOKEN: ${{ secrets.CI_SHOPIFY_STOREFRONT_ACCESS_TOKEN }}
          SHOPIFY_SHOP_ID: ${{ secrets.SHOPIFY_SHOP_ID }}
          NEXT_PUBLIC_BASE_URL: https://wildenflower.com
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

  e2e:
    name: E2E (${{ matrix.browser }})
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Each engine job also runs its phone project (playwright.config.ts).
        include:
          - browser: chromium
            projects: --project=chromium --project=mobile-chrome
          - browser: firefox
            projects: --project=firefox
          - browser: webkit
            projects: --project=webkit --project=mobile-safari
    env:
      CI: true
      SHOPIFY_STORE_DOMAIN: ${{ secrets.CI_SHOPIFY_STORE_DOMAIN }}
      SHOPIFY_STOREFRONT_ACCESS_TOKEN: ${{ secrets.CI_SHOPIFY_STOREFRONT_ACCESS_TOKEN }}
      NEXT_PUBLIC_SHOPIFY_STORE_DOMAIN: ${{ secrets.CI_SHOPIFY_STORE_DOMAIN }}
      NEXT_PUBLIC_SHOPIFY_STOREFRONT_ACCESS_TOKEN: ${{ secrets.CI_SHOPIFY_STOREFRONT_ACCESS_TOKEN }}
      SHOPIFY_SHOP_ID: ${{ secrets.SHOPIFY_SHOP_ID }}
      # Placeholder, not a secret: lets /api/auth/customer/authorize build its
      # redirect for e2e/auth.spec.ts. No real code is ever exchanged.
      SHOPIFY_CUSTOMER_ACCOUNT_CLIENT_ID: e2e-placeholder-client-id
      NEXT_PUBLIC_BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps ${{ matrix.browser }}

      # E2E tests the production build (`next start` in playwright.config.ts).
      # Built here, not in the webServer command, so build time does not count
      # against the server-start timeout.
      - name: Build (production)
        run: npx next build

      - name: Run Playwright tests
        run: npx playwright test ${{ matrix.projects }}

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 30

  secrets:
    name: Secrets Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm audit --audit-level=high --omit=dev

  # Brand slop merge-gate (ADR 0022 D-CAD). Runs the deterministic
  # slop-detector only against the PR's changed in-scope files, so it blocks
  # newly-touched off-brand slop without being held hostage by deferred
  # legacy residue (emails/admin/account). PR-only: `push` has no PR base.
  # Touched-file ratchet — see .claude/skills/slop-detector/SKILL.md.
  slop:
    name: Slop Detector
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Collect changed in-scope files
        shell: bash
        run: |
          git diff --name-only --find-renames --diff-filter=ACMR \
            "${{ github.event.pull_request.base.sha }}...HEAD" \
            -- app components lib content > .slop-files
          echo "Changed in-scope files:"; cat .slop-files

      - name: Run slop detector on changed files
        shell: bash
        run: |
          if [ ! -s .slop-files ]; then
            echo "No in-scope files changed; slop gate passes."
            exit 0
          fi
          mapfile -t files < .slop-files
          bash .claude/skills/slop-detector/check.sh "${files[@]}"

  # Production deploys are handled by Vercel's native GitHub integration
  # (the "Vercel – shopsite-prod" check on each push to main), not by this
  # workflow. A former `deploy-prod` job that shelled out to the Vercel CLI
  # was removed: it never deployed anything real (its VERCEL_PROJECT_ID_PROD
  # secret pointed at a non-existent project, so `vercel pull` failed with
  # "Project not found"), and it duplicated the native integration while
  # parking every push on a required-reviewer approval gate. If a
  # CLI-driven deploy is ever needed again, restore it with correct
  # VERCEL_ORG_ID / VERCEL_PROJECT_ID_PROD / VERCEL_TOKEN secrets.
