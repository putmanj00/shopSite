# .github/dependabot.yml
# Dependabot version update configuration.
# npm minor + patch updates are grouped into a single weekly PR to minimize noise.
# Major updates arrive as separate PRs so each breaking change is evaluated on its own.
# GitHub Actions dependencies are also monitored (dormant until Phase 20 adds workflows).
# All PRs require manual review — no auto-merge.
# Source: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuring-dependabot-version-updates
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      all-npm-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 10

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
